# docker-compose.yml: Docker Compose configuration for building, running, and validating Privateerr with Gluetun and qBittorrent.
#
# Learn more about manual PIA VPN connections here: https://github.com/pia-foss/manual-connections
#

#
# Labels for containers that should not be updated unattended by Watchtower.
#
# Privateerr, Gluetun, and Buccaneerr coordinate VPN configuration, tunnel
# startup, port-forwarding behavior, and validation. Update them intentionally
# after checking release notes so the VPN test path changes under supervision.
#
x-disable-watchtower-updates: &disable-watchtower-updates  # Disable unattended Watchtower updates
  - "com.centurylinklabs.watchtower.enable=false"          # Require intentional updates for this container

#
# Shared healthcheck timing settings.
#
x-default-healthcheck-settings: &default-healthcheck-settings  # YAML anchor for healthcheck settings
  interval: ${DEFAULT_HEALTHCHECK_INTERVAL}                    # Run the check at this interval
  timeout: ${DEFAULT_HEALTHCHECK_TIMEOUT}                      # Fail if it exceeds this duration
  start_period: ${DEFAULT_HEALTHCHECK_START_PERIOD}            # Grace period before checks start
  retries: ${DEFAULT_HEALTHCHECK_RETRIES}                      # Mark as unhealthy after failures

#
# Define the services used in this stack.
#
services:
  #
  # Configure the service that generates WireGuard config and Gluetun metadata.
  #
  privateerr:
    # Docker image build and container information
    image: ghcr.io/scottgigawatt/privateerr:${PRIVATEERR_TAG}             # Set the image tag for the container
    build:                                                                # Define build context and arguments
      context: docker                                                     # Directory containing the Dockerfile
      dockerfile: Dockerfile                                              # Dockerfile used for building the image
      args:                                                               # Arguments passed to the Dockerfile build stage
        ALPINE_TAG: ${ALPINE_TAG}                                         # Base Alpine image version
        PIA_BIN_HOME: ${PIA_BIN_HOME}                                     # Directory where PIA scripts will reside
        PRIVATEERR_BIN_HOME: ${PRIVATEERR_BIN_HOME}                       # Directory where helper scripts will reside
        IMAGE_CREATED: ${IMAGE_CREATED}                                   # OCI image creation timestamp
        IMAGE_REVISION: ${IMAGE_REVISION}                                 # OCI image source revision
        IMAGE_VERSION: ${PRIVATEERR_TAG}                                  # OCI image version
    container_name: ${COMPOSE_PROJECT_NAME}-privateerr-${PRIVATEERR_TAG}  # Container name including the tag
    restart: unless-stopped                                               # Restart the supervisor unless explicitly stopped
    hostname: privateerr                                                  # Set hostname inside the container

    # Generate configuration without container privileges or capability escalation
    cap_drop:
      - ALL  # Upstream requires UID 0 but does not need Linux capabilities
    security_opt:
      - no-new-privileges:true  # Prevent subprocesses from acquiring additional privileges

    # Let Docker disable IPv6 in this container before the PIA scripts start
    sysctls:
      net.ipv6.conf.all.disable_ipv6: ${PRIVATEERR_IPV6_DISABLED}      # Existing interfaces: 1 disables IPv6; 0 enables IPv6
      net.ipv6.conf.default.disable_ipv6: ${PRIVATEERR_IPV6_DISABLED}  # New interfaces: 1 disables IPv6; 0 enables IPv6

    # Apply Docker labels to the container
    labels: *disable-watchtower-updates  # VPN bootstrap component; update intentionally

    # Define the container environment
    environment:
      # PIA manual connection environment variables
      VPN_PROTOCOL: ${PIA_VPN_PROTOCOL}          # VPN type: wireguard NOT openvpn
      DISABLE_IPV6: ${PIA_DISABLE_IPV6}          # yes requests upstream IPv6 disabling; no skips it
      DIP_TOKEN: ${PIA_DIP_TOKEN}                # Optional PIA dedicated IP token
      AUTOCONNECT: ${PIA_AUTOCONNECT}            # true selects the lowest-latency server; false uses PREFERRED_REGION
      PREFERRED_REGION: ${PIA_PREFERRED_REGION}  # PIA region ID used when AUTOCONNECT=false
      PIA_CONF_PATH: ${PIA_CONF_PATH}            # Path where WireGuard config will be generated
      PIA_CONNECT: ${PIA_CONNECT}                # false generates files only; required for Gluetun recovery
      PIA_PF: ${PIA_PF}                          # true selects a port-forwarding-capable region
      PIA_DNS: ${PIA_DNS}                        # true includes PIA DNS settings in wg0.conf
      PIA_WG_SERVER_NAME: ${PIA_WG_SERVER_NAME}  # Optional generated WireGuard server name fallback
      PIA_USER: ${PIA_USER}                      # PIA account username
      PIA_PASS: ${PIA_PASS}                      # PIA account password

      # Privateerr environment variables
      PRIVATEERR_METADATA_PATH: ${PRIVATEERR_METADATA_PATH}                            # Path where metadata will be generated
      PRIVATEERR_HEALTHCHECK_MARKER: ${PRIVATEERR_HEALTHCHECK_MARKER}                  # File written after successful generation
      PRIVATEERR_KEEPALIVE: ${PRIVATEERR_KEEPALIVE}                                    # true keeps Privateerr running after generation; required for recovery
      PRIVATEERR_LOG_PATH: ${PRIVATEERR_LOG_PATH}                                      # Privateerr log file path
      PRIVATEERR_AUTO_RECOVER: ${PRIVATEERR_AUTO_RECOVER}                              # true enables API-based recovery; requires a shared API key
      PRIVATEERR_GLUETUN_API_KEY: ${PRIVATEERR_GLUETUN_API_KEY}                        # Shared control API key: 20-128 alphanumeric characters; keep private
      PRIVATEERR_GLUETUN_URL: ${PRIVATEERR_GLUETUN_URL}                                # Internal authenticated Gluetun control API
      PRIVATEERR_GLUETUN_HEALTH_URL: ${PRIVATEERR_GLUETUN_HEALTH_URL}                  # Internal Gluetun tunnel health endpoint
      PRIVATEERR_RECOVERY_INTERVAL_SECONDS: ${PRIVATEERR_RECOVERY_INTERVAL_SECONDS}    # Seconds between health probes
      PRIVATEERR_RECOVERY_FAILURE_SECONDS: ${PRIVATEERR_RECOVERY_FAILURE_SECONDS}      # Startup grace and continuous failure threshold in seconds
      PRIVATEERR_RECOVERY_COOLDOWN_SECONDS: ${PRIVATEERR_RECOVERY_COOLDOWN_SECONDS}    # Initial retry delay in seconds; doubles up to one hour
      PRIVATEERR_GENERATION_TIMEOUT_SECONDS: ${PRIVATEERR_GENERATION_TIMEOUT_SECONDS}  # Maximum seconds for one PIA generation

    # Report healthy after the wrapper finishes successfully
    healthcheck:
      <<: *default-healthcheck-settings  # Pull in default healthcheck settings
      test:                              # Healthy when healthcheck marker file exists
        - CMD
        - privateerr-healthcheck

    # Mount host directories into the container
    volumes:
      - ${PRIVATEERR_GLUETUN_CONFIG_PATH}:/gluetun:rw    # Gluetun config output consumed by Gluetun
      - ${PRIVATEERR_CONFIG_PATH}:/privateerr-config:rw  # Privateerr service config directory

  #
  # Configure the service that runs Gluetun with the generated WireGuard config.
  #
  gluetun:
    # Docker image and container information
    image: qmcgaw/gluetun:${GLUETUN_TAG}                            # Gluetun image used for live VPN validation
    container_name: ${COMPOSE_PROJECT_NAME}-gluetun-${GLUETUN_TAG}  # Container name including the tag
    restart: unless-stopped                                         # Restart Gluetun unless explicitly stopped
    hostname: gluetun                                               # Set hostname inside the container

    # Load Privateerr metadata before Gluetun starts
    entrypoint: ["/bin/sh", "${GLUETUN_ENTRYPOINT_WRAPPER}"]  # Load Privateerr metadata before starting Gluetun

    # Add additional linux capabilities
    cap_add:
      - NET_ADMIN  # Grant network admin capability for VPN and network interface configuration

    # Pass host devices into the container for direct hardware access
    devices:
      - /dev/net/tun:/dev/net/tun  # Allow container to handle encrypted VPN traffic directly

    # Apply Docker labels to the container
    labels: *disable-watchtower-updates  # VPN tunnel component; update intentionally

    # Define the container environment
    environment:
      VPN_SERVICE_PROVIDER: ${GLUETUN_VPN_SERVICE_PROVIDER}                  # Use Gluetun's custom provider for PIA WireGuard
      VPN_TYPE: ${GLUETUN_VPN_TYPE}                                          # Force WireGuard for validation
      VPN_PORT_FORWARDING: ${GLUETUN_VPN_PORT_FORWARDING}                    # Enable VPN-side port forwarding
      VPN_PORT_FORWARDING_PROVIDER: ${GLUETUN_VPN_PORT_FORWARDING_PROVIDER}  # PIA port-forwarding helper
      VPN_PORT_FORWARDING_USERNAME: ${PIA_USER}                              # PIA username for Gluetun port forwarding
      VPN_PORT_FORWARDING_PASSWORD: ${PIA_PASS}                              # PIA password for Gluetun port forwarding
      HEALTH_TARGET_ADDRESSES: ${GLUETUN_HEALTH_TARGET_ADDRESSES}            # TCP/TLS targets Gluetun checks for VPN health
      HEALTH_ICMP_TARGET_IPS: ${GLUETUN_HEALTH_ICMP_TARGET_IPS}              # ICMP targets Gluetun checks for VPN health
      HEALTH_SERVER_ADDRESS: 127.0.0.1:9999                                  # Internal Gluetun health server address
      HEALTH_RESTART_VPN: ${GLUETUN_HEALTH_RESTART_VPN}                      # Gluetun restart policy when Privateerr recovery is disabled
      GLUETUN_DEFAULT_ENTRYPOINT: ${GLUETUN_DEFAULT_ENTRYPOINT}              # Original Gluetun entrypoint

      # Synchronize qBittorrent with the VPN port lease
      QBITTORRENT_PORT_SYNC: ${QBITTORRENT_PORT_SYNC}                # Keep the application synchronized with the VPN lease
      QBITTORRENT_API_URL: ${QBITTORRENT_API_URL}                    # Application API inside the shared VPN namespace
      QBITTORRENT_API_WAIT_SECONDS: ${QBITTORRENT_API_WAIT_SECONDS}  # Maximum seconds to wait for the Web API

      # Define downloader port-forwarding commands for Gluetun
      VPN_PORT_FORWARDING_UP_COMMAND: /bin/sh -c "${GLUETUN_QBITTORRENT_PORT_FORWARDING_SCRIPT} up {{PORT}} {{VPN_INTERFACE}}"  # Update qBittorrent when PIA assigns a forwarded port
      VPN_PORT_FORWARDING_DOWN_COMMAND: /bin/sh -c "${GLUETUN_QBITTORRENT_PORT_FORWARDING_SCRIPT} down"                         # Clear qBittorrent's forwarded port during shutdown

      # Define Privateerr metadata environment variables for Gluetun
      PRIVATEERR_METADATA_PATH: ${PRIVATEERR_METADATA_PATH}                                  # Path to the generated PIA metadata
      PRIVATEERR_GLUETUN_METADATA_WAIT_SECONDS: ${PRIVATEERR_GLUETUN_METADATA_WAIT_SECONDS}  # Maximum seconds to wait for metadata
      PRIVATEERR_AUTO_RECOVER: ${PRIVATEERR_AUTO_RECOVER}                                    # Enable the internal health listener and API role
      PRIVATEERR_GLUETUN_API_KEY: ${PRIVATEERR_GLUETUN_API_KEY}                              # Shared API key used by Privateerr

    # Publish only the application Web UI on the configured Web UI port
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"  # Publish the configured application Web UI port

    # Mount host directories into the container
    volumes:
      - ${GLUETUN_CONFIG_PATH}:/gluetun:rw                               # Gluetun config directory
      - ${GLUETUN_CONFIG_PATH}:/tmp/gluetun:rw                           # Gluetun runtime state directory
      - ${GLUETUN_WRAPPER_SCRIPT_PATH}:${GLUETUN_ENTRYPOINT_WRAPPER}:ro  # Gluetun entrypoint wrapper script

    # Define container healthcheck to verify VPN connectivity
    healthcheck:
      <<: *default-healthcheck-settings  # Pull in default healthcheck settings
      test:                              # Check Gluetun's internal health server
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:9999

    # Specify container service dependencies
    depends_on:
      privateerr:
        condition: service_healthy  # Wait for Privateerr to generate config and metadata

  #
  # Configure the torrent client sharing Gluetun's protected network.
  #
  qbittorrent:
    # Docker image and container information
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_TAG}               # Use the selected application release
    container_name: ${COMPOSE_PROJECT_NAME}-qbittorrent-${QBITTORRENT_TAG}  # Namespace the application container
    restart: unless-stopped                                                 # Restart exited processes unless explicitly stopped
    network_mode: service:gluetun                                           # Route all application traffic through Gluetun

    # Set host ownership for persistent application files
    environment:
      PUID: ${QBITTORRENT_PUID}              # Host user owning configuration and downloads
      PGID: ${QBITTORRENT_PGID}              # Host group owning configuration and downloads
      TZ: ${QBITTORRENT_TZ}                  # Application time zone
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT}  # Internal and published application port

    # Preserve application state and downloads across container replacement
    volumes:
      - ${QBITTORRENT_CONFIG_PATH}:/config:rw                   # Persistent application configuration
      - ${HOST_TORRENTS_DOWNLOADS_PATH}:/downloads/torrents:rw  # Torrent downloads only

    # Check application readiness independently of tunnel health
    healthcheck:
      <<: *default-healthcheck-settings  # Reuse the stack's healthcheck timing
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - ${QBITTORRENT_API_URL}/

    # Start the application only after Gluetun establishes a healthy tunnel
    depends_on:
      gluetun:
        condition: service_healthy  # Wait for a working VPN
        restart: true               # Follow explicit Compose-managed Gluetun updates

  #
  # Configure the service that validates Gluetun and port forwarding.
  #
  buccaneerr:
    # Docker image build and container information
    image: ghcr.io/scottgigawatt/buccaneerr:${BUCCANEERR_TAG}             # Buccaneerr image name and tag
    build:                                                                # Define build context and Dockerfile
      context: test                                                       # Directory containing Buccaneerr Dockerfile
      dockerfile: Dockerfile                                              # Dockerfile used for validation tools
      args:                                                               # Arguments passed to the Buccaneerr image
        ALPINE_TAG: ${ALPINE_TAG}                                         # Base Alpine image version
        BUCCANEERR_BIN_HOME: ${BUCCANEERR_BIN_HOME}                       # Directory where Buccaneerr scripts will reside
        IMAGE_CREATED: ${IMAGE_CREATED}                                   # OCI image creation timestamp
        IMAGE_REVISION: ${IMAGE_REVISION}                                 # OCI image source revision
        IMAGE_VERSION: ${BUCCANEERR_TAG}                                  # OCI image version
    container_name: ${COMPOSE_PROJECT_NAME}-buccaneerr-${BUCCANEERR_TAG}  # Buccaneerr container name
    restart: "no"                                                         # Buccaneerr exits with pass/fail status
    network_mode: service:gluetun                                         # Test from inside Gluetun's network namespace

    # Allow the test-only validator to inject and remove a VPN endpoint failure
    cap_add:
      - NET_ADMIN  # Change firewall rules only inside the shared test namespace

    # Apply Docker labels to the container
    labels: *disable-watchtower-updates  # VPN validation component; update intentionally

    # Define the container environment
    environment:
      BUCCANEERR_CONFIG_PATH: ${BUCCANEERR_CONFIG_PATH}                            # Mounted generated config directory
      BUCCANEERR_GLUETUN_PATH: ${BUCCANEERR_GLUETUN_PATH}                          # Mounted Gluetun state directory
      BUCCANEERR_HEALTH_URL: ${BUCCANEERR_HEALTH_URL}                              # Gluetun unauthenticated health URL
      BUCCANEERR_REQUIRE_PORT_FORWARD: ${BUCCANEERR_REQUIRE_PORT_FORWARD}          # Require port-forwarding success
      QBITTORRENT_API_URL: ${QBITTORRENT_API_URL}                                  # Application API inside the shared VPN namespace
      BUCCANEERR_GLUETUN_URL: ${BUCCANEERR_GLUETUN_URL}                            # Local Gluetun control API
      PRIVATEERR_GLUETUN_API_KEY: ${PRIVATEERR_GLUETUN_API_KEY}                    # Shared key for read-only recovery verification
      BUCCANEERR_TEST_RECOVERY: ${BUCCANEERR_TEST_RECOVERY}                        # true briefly interrupts the demo VPN and verifies automatic recovery
      BUCCANEERR_RECOVERY_WAIT_SECONDS: ${BUCCANEERR_RECOVERY_WAIT_SECONDS}        # Maximum seconds for automatic recovery
      BUCCANEERR_APPLICATION_WAIT_SECONDS: ${BUCCANEERR_APPLICATION_WAIT_SECONDS}  # Maximum seconds for application port synchronization
      BUCCANEERR_VPN_INTERFACE: ${BUCCANEERR_VPN_INTERFACE}                        # Expected application VPN interface
      BUCCANEERR_LOG_PATH: ${BUCCANEERR_LOG_PATH}                                  # Buccaneerr log file path

    # Mount host directories into the container
    volumes:
      - ${BUCCANEERR_CONFIG_PATH_HOST}:/config:ro        # Generated Privateerr outputs
      - ${BUCCANEERR_GLUETUN_PATH_HOST}:/gluetun:ro      # Gluetun state outputs
      - ${BUCCANEERR_CONFIG_HOME}:/buccaneerr-config:rw  # Buccaneerr service config directory

    # Specify container service dependencies
    depends_on:
      gluetun:
        condition: service_healthy  # Wait for Gluetun to report healthy
      qbittorrent:
        condition: service_healthy  # Validate only after the application Web UI is ready
