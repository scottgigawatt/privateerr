# .trivyignore.yaml: Expiring CI exceptions for official Buccaneerr CLI tools.
#

vulnerabilities:
  #
  # Supported Compose checks use trusted fixtures and the wrapper's local Docker socket.
  # Reassess the official binary and remove this exception before its expiry.
  #
  - id: CVE-2026-78669
    paths:
      - usr/local/lib/docker/cli-plugins/docker-compose
    expired_at: 2026-10-23
    statement: >-
      This advisory affects HTTP/2 clients and servers; Compose is not generally exempt.
      Supported repository checks use trusted fixtures and the wrapper's local Unix Docker socket.
      The wrapper rejects remote Docker contexts and does not forward DOCKER_HOST.
      Runtime tests may use networking; untrusted HTTP/2 peers outside this boundary remain a risk.
      Retain unfiltered artifact scans while awaiting compatible official Compose updates.
