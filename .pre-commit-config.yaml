# .pre-commit-config.yaml: Repository lint, secret, Markdown, workflow, shell,
#                          policy, YAML, and Dockerfile validation hooks.
#

#
# Define the pre-commit configuration for the repository
#
repos:
  #
  # Scan changed content for hardcoded secrets before it can be committed.
  #
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  #
  # Compare detected secrets against the reviewed repository baseline.
  #
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package.lock.json

  #
  # Run general file hygiene, syntax, shebang, and whitespace checks.
  #
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  #
  # Validate every Markdown document with the shared repository configuration.
  #
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        pass_filenames: false

  #
  # Enforce strict two-space YAML across repository configuration files.
  #
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - "--strict"
          - "-d"
          - "{extends: default, rules: {document-start: disable, indentation: {spaces: 2, indent-sequences: true}, line-length: disable, truthy: disable}}"

  #
  # Validate GitHub Actions expressions, permissions, and shell fragments.
  #
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  #
  # Check project-owned shell scripts for correctness and portability issues.
  #
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  #
  # Enforce synchronized build pins and the shared image-tag channel policy.
  #
  - repo: local
    hooks:
      - id: python-types
        name: strict Python types (Buccaneerr)
        entry: scripts/compose/test.sh types
        language: script
        pass_filenames: false
        always_run: true

      - id: check-build-pin-policy
        name: check build pin policy
        entry: test/policy/check-build-pin-policy.sh
        language: script
        pass_filenames: false

      - id: check-image-tag-policy
        name: check image tag policy
        entry: test/policy/check-image-tag-policy.sh
        language: script
        pass_filenames: false

  #
  # Lint both project Dockerfiles against container image best practices.
  #
  - repo: local
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        description: Runs the digest-pinned Hadolint image against Dockerfiles
        entry: ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint
        language: docker_image
        types: [dockerfile]
        args: ["--ignore", "DL3018"]

  #
  # Use Buccaneerr's Ruff for the same Python checks as Make and PR validation.
  #
  - repo: local
    hooks:
      - id: check-executable-modes
        name: Check executable modes and shebangs
        entry: python3 test/policy/check-executable-modes.py
        language: system
        types: [file]
      - id: ruff-check
        name: Check Python with Ruff
        entry: scripts/compose/test.sh python-lint
        language: script
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: Check Python formatting with Ruff
        entry: scripts/compose/test.sh python-format
        language: script
        pass_filenames: false
        types: [python]
