#
# build-and-push.yml: Validate, publish, attest, mirror, and announce Privateerr.
#

name: "Hoist the Registry Sails 🏴‍☠️"

#
# Publish relevant changes from main and semantic-version tags. The weekly run
# refreshes the moving edge images, while manual dispatch supports recovery.
#
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - ".trivyignore.yaml"
      - ".github/discord/**"
      - ".github/scripts/**"
      - ".github/workflows/build-and-push.yml"
      - "Makefile"
      - "ruff.toml"
      - "pyrightconfig.json"
      - ".pre-commit-config.yaml"
      - "scripts/compose/test.sh"
      - "config/**"
      - "docker/**"
      - "docs/docker-hub-description.md"
      - "docker-compose.yml"
      - "example.env"
      - "test/**"
      - ".dockerignore"
      - "requirements-docs.txt"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  #
  # Announce eligible image pipelines independently of validation and registry credentials.
  # Delivery failures never change publication results or stop another destination.
  #
  notify-start:
    name: "Open the Image Wardrobe 📣 (${{ matrix.image-name }}, ${{ matrix.profile }})"
    if: (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: privateerr
            image-name: Privateerr
            profile: image-primary
            dockerhub: true
          - image: privateerr
            image-name: Privateerr
            profile: image-secondary
            dockerhub: true
          - image: buccaneerr
            image-name: Buccaneerr
            profile: image-primary
            dockerhub: false
          - image: buccaneerr
            image-name: Buccaneerr
            profile: image-secondary
            dockerhub: false

    steps:
      #
      # Read notification assets without retaining repository credentials.
      #
      - name: "Unpack the Notification Wardrobe 🧰"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      #
      # Name only the two notification secrets and keep webhook values out of logs.
      # Guard both routes so an unset webhook cannot select the other server.
      #
      - name: "Notify Discord: image pipeline started 📣"
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ matrix.profile == 'image-primary' && secrets.DISCORD_WEBHOOK_URL || matrix.profile == 'image-secondary' && secrets.DISCORD_HADES_HOOK_URL || '' }}
          IMAGE_NAME: ${{ matrix.image-name }}
          PROFILE: ${{ matrix.profile }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          ACTOR: ${{ github.actor }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DOCKERHUB_IMAGE: ${{ matrix.dockerhub && format('docker.io/{0}/{1}', github.repository_owner, matrix.image) || '' }}
        run: |
          sh .github/scripts/discord-notifier.sh \
              --type "image-start" \
              --profile "${PROFILE}" \
              --image-name "${IMAGE_NAME}" \
              --run-url "${RUN_URL}" \
              --repository "${REPOSITORY}" \
              --ref-name "${REF_NAME}" \
              --workflow-name "${WORKFLOW_NAME}" \
              --actor "${ACTOR}" \
              --ghcr-image "${GHCR_IMAGE}" \
              --dockerhub-image "${DOCKERHUB_IMAGE}" \
              --platforms "linux/amd64,linux/arm64,linux/arm/v7"

  #
  # Build and inspect both images before publishing their multi-architecture
  # manifests, attestations, registry mirrors, and release notifications.
  #
  build-and-push:
    name: "Pack the Cargo Hold 🧰"
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      privateerr-publication: ${{ steps.publish-privateerr.outcome }}
      privateerr-tags: ${{ steps.notification-tags.outputs.privateerr-tags }}
      privateerr-digest: ${{ steps.publish-privateerr.outputs.digest }}
      privateerr-result: ${{ steps.publish-privateerr.outcome == 'success' && steps.attest-privateerr.outcome == 'success' && steps.verify-mirror.outcome == 'success' && steps.overview.outcome == 'success' && 'success' || '' }}
      privateerr-stage: >-
        ${{ steps.release-check.outcome == 'failure' && 'Release tag validation'
            || steps.validate.outcome == 'failure' && 'Repository validation'
            || steps.local-build.outcome == 'failure' && 'Local image builds and container checks'
            || steps.runtime-check.outcome == 'failure' && 'Optional VPN integration checks'
            || steps.cleanup.outcome == 'failure' && 'Test cleanup'
            || steps.scan-privateerr.outcome == 'failure' && 'Privateerr vulnerability scan'
            || steps.scan-buccaneerr.outcome == 'failure' && 'Buccaneerr vulnerability scan'
            || steps.publish-privateerr.outcome == 'failure' && 'Privateerr build or GHCR publication'
            || steps.publish-buccaneerr.outcome == 'failure' && 'Buccaneerr build or GHCR publication'
            || steps.mirror.outcome == 'failure' && 'Privateerr Docker Hub mirror'
            || steps.verify-mirror.outcome == 'failure' && 'Registry digest verification'
            || steps.attest-privateerr.outcome == 'failure' && 'Privateerr provenance attestation'
            || steps.attest-buccaneerr.outcome == 'failure' && 'Buccaneerr provenance attestation'
            || steps.overview.outcome == 'failure' && 'Docker Hub description update'
            || 'Publication or required verification' }}
      privateerr-mirror: ${{ steps.mirror.outcome }}
      buccaneerr-publication: ${{ steps.publish-buccaneerr.outcome }}
      buccaneerr-tags: ${{ steps.notification-tags.outputs.buccaneerr-tags }}
      buccaneerr-digest: ${{ steps.publish-buccaneerr.outputs.digest }}
      buccaneerr-result: ${{ steps.publish-buccaneerr.outcome == 'success' && steps.attest-buccaneerr.outcome == 'success' && 'success' || '' }}
      buccaneerr-stage: >-
        ${{ steps.release-check.outcome == 'failure' && 'Release tag validation'
            || steps.validate.outcome == 'failure' && 'Repository validation'
            || steps.local-build.outcome == 'failure' && 'Local image builds and container checks'
            || steps.runtime-check.outcome == 'failure' && 'Optional VPN integration checks'
            || steps.cleanup.outcome == 'failure' && 'Test cleanup'
            || steps.scan-privateerr.outcome == 'failure' && 'Privateerr vulnerability scan'
            || steps.scan-buccaneerr.outcome == 'failure' && 'Buccaneerr vulnerability scan'
            || steps.publish-privateerr.outcome == 'failure' && 'Privateerr build or GHCR publication'
            || steps.publish-buccaneerr.outcome == 'failure' && 'Buccaneerr build or GHCR publication'
            || steps.mirror.outcome == 'failure' && 'Privateerr Docker Hub mirror'
            || steps.verify-mirror.outcome == 'failure' && 'Registry digest verification'
            || steps.attest-privateerr.outcome == 'failure' && 'Privateerr provenance attestation'
            || steps.attest-buccaneerr.outcome == 'failure' && 'Buccaneerr provenance attestation'
            || steps.overview.outcome == 'failure' && 'Docker Hub description update'
            || 'Publication or required verification' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
      PRIVATEERR_LOCAL_IMAGE_REF: ghcr.io/${{ github.repository }}
      BUCCANEERR_LOCAL_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/buccaneerr
      PRIVATEERR_IMAGE_REF: ghcr.io/${{ github.repository }}
      BUCCANEERR_IMAGE_REF: ghcr.io/${{ github.repository_owner }}/buccaneerr
      DOCKERHUB_PRIVATEERR_IMAGE_REF: docker.io/${{ github.repository_owner }}/privateerr

    steps:
      #
      # Check out complete history and the upstream PIA submodule without
      # retaining credentials. Helper scripts are invoked from this checkout.
      #
      - name: "Grab the Treasure Map 🗺️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      #
      # Accept only annotated semantic-version tags whose commits already
      # belong to main before any release image can be published.
      #
      - name: "Inspect the Release Chart 🧭"
        id: release-check
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          .github/scripts/validate-release-tag.sh \
            --release-tag "${{ github.ref_name }}" \
            --release-sha "${{ github.sha }}"

      #
      # Prepare emulation, Buildx, and registry authentication for one
      # multi-architecture build across every supported platform.
      #
      - name: "Summon Cross-Arch Cannons 🧨"
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4

      #
      # Create the Buildx builder used by local validation and publication.
      #
      - name: "Sharpen the Build Axe 🪓"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      #
      # Authenticate to GHCR with the job-scoped token before publishing images.
      #
      - name: "Board the GHCR Galleon 🔐"
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #
      # Seed static Compose defaults in an ephemeral environment file, then
      # expose dynamic OCI metadata through GitHub's runner environment.
      #
      - name: "Ink the Build Scroll 📜"
        id: build-scroll
        run: |
          created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cp example.env .env
          {
            printf 'IMAGE_CREATED=%s\n' "${created}"
            printf 'IMAGE_REVISION=%s\n' "${GITHUB_SHA}"
          } >> "${GITHUB_ENV}"
          printf 'created=%s\n' "${created}" >> "${GITHUB_OUTPUT}"

      #
      # Route local policy, helper, and Compose validation through the same
      # Make interface contributors use before building either image.
      #
      - name: "Interrogate the Rigging 🧪"
        id: validate
        run: |
          make test
          make config >/dev/null
          make test-precommit

      #
      # Build both local image shapes before runtime tests and vulnerability scans.
      #
      - name: "Hammer the Docker Hulls ⚒️"
        id: local-build
        run: |
          make build
          make build-buccaneerr
          PRIVATEERR_TEST_IMAGE="${PRIVATEERR_LOCAL_IMAGE_REF}:latest" make test-recovery-api

      #
      # Run the credential-backed e2e voyage when both optional PIA secrets exist.
      #
      - name: "Send the Test Ship to Sea 🌊"
        id: runtime-check
        env:
          PIA_USER: ${{ secrets.PIA_USER }}
          PIA_PASS: ${{ secrets.PIA_PASS }}
        run: |
          if [ -z "${PIA_USER}" ] || [ -z "${PIA_PASS}" ]; then
            printf '%s\n' "PIA secrets missing; skipping live e2e voyage."
            exit 0
          fi

          # Exercise legacy generation independently of the example's recovery default.
          PRIVATEERR_AUTO_RECOVER=false BUCCANEERR_TEST_RECOVERY=false make test-e2e

      #
      # Always stop test resources and restore checked-in example configuration.
      #
      - name: "Swab the Test Deck 🧽"
        id: cleanup
        if: always()
        run: make clean-test

      #
      # Reject fixed HIGH or CRITICAL vulnerabilities before either image
      # can be tagged or sent to a registry.
      #
      - name: "Inspect Privateerr for Bilge Rot 🔍"
        id: scan-privateerr
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.PRIVATEERR_LOCAL_IMAGE_REF }}:latest
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      #
      # Apply the same fixed-vulnerability policy to the Buccaneerr test image.
      #
      - name: "Inspect Buccaneerr for Bilge Rot 🔍"
        id: scan-buccaneerr
        env:
          TRIVY_SHOW_SUPPRESSED: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.BUCCANEERR_LOCAL_IMAGE_REF }}:latest
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

          # The exact-path exception expires automatically; retain every other finding.
          trivyignores: .trivyignore.yaml
          exit-code: 1

      #
      # Derive matching edge, commit, and semantic-version tags for the
      # production and test images from the current Git reference.
      #
      - name: "Chart Privateerr Tags 🗺️"
        id: meta-privateerr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.PRIVATEERR_IMAGE_REF }}
          flavor: |
            latest=auto
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      #
      # Derive the matching release-channel tags for the Buccaneerr image.
      #
      - name: "Chart Buccaneerr Tags 🗺️"
        id: meta-buccaneerr
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.BUCCANEERR_IMAGE_REF }}
          flavor: |
            latest=auto
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      #
      # Build Privateerr once for all supported architectures, publish it
      # to GHCR, and attach index annotations, SBOM, and provenance data.
      #
      - name: "Publish Privateerr to GHCR 💰"
        id: publish-privateerr
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: docker
          file: docker/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.meta-privateerr.outputs.tags }}
          labels: ${{ steps.meta-privateerr.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.title=Privateerr
            index:org.opencontainers.image.description=Privateerr generates PIA WireGuard configs and Gluetun metadata from unmodified PIA manual connection scripts.
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
          build-args: |
            ALPINE_TAG=3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
            PIA_BIN_HOME=/pia
            PRIVATEERR_BIN_HOME=/privateerr
            IMAGE_CREATED=${{ steps.build-scroll.outputs.created }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.meta-privateerr.outputs.version }}
          sbom: true
          provenance: true

      #
      # Install the registry-native copy tool, then mirror every Privateerr
      # tag from GHCR to Docker Hub without rebuilding the image.
      #
      - name: "Install Skopeo 🪞"
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      #
      # Copy every published Privateerr manifest from GHCR to Docker Hub.
      #
      - name: "Mirror Privateerr to Docker Hub 🪞"
        id: mirror
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          .github/scripts/registry-mirror.sh \
            --mirror \
            --ghcr-image         "${{ env.PRIVATEERR_IMAGE_REF }}" \
            --dockerhub-image    "${{ env.DOCKERHUB_PRIVATEERR_IMAGE_REF }}" \
            --ghcr-username      "${{ github.actor }}" \
            --dockerhub-username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --published-tags     "${{ steps.meta-privateerr.outputs.tags }}"

      #
      # Fail publication unless both registries expose identical tag digests.
      #
      - name: "Compare Registry Manifests 🔎"
        id: verify-mirror
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          .github/scripts/registry-mirror.sh \
            --verify \
            --ghcr-image         "${{ env.PRIVATEERR_IMAGE_REF }}" \
            --dockerhub-image    "${{ env.DOCKERHUB_PRIVATEERR_IMAGE_REF }}" \
            --ghcr-username      "${{ github.actor }}" \
            --dockerhub-username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --published-tags     "${{ steps.meta-privateerr.outputs.tags }}"

      #
      # Publish the test-only Buccaneerr image to GHCR for every supported
      # architecture with its own SBOM and provenance data.
      #
      - name: "Publish Buccaneerr to GHCR 💰"
        id: publish-buccaneerr
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: test/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.meta-buccaneerr.outputs.tags }}
          labels: ${{ steps.meta-buccaneerr.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.title=Buccaneerr
            index:org.opencontainers.image.description=Test-only Buccaneerr validator for Privateerr, Gluetun WireGuard, and PIA port-forwarding e2e checks.
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
          build-args: |
            ALPINE_TAG=3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
            BUCCANEERR_BIN_HOME=/buccaneerr
            IMAGE_CREATED=${{ steps.build-scroll.outputs.created }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.meta-buccaneerr.outputs.version }}
          sbom: true
          provenance: true

      #
      # Publish registry-backed build attestations for both image digests
      # after their multi-architecture manifests are available.
      #
      - name: "Stamp Privateerr's Provenance Scroll 🧾"
        id: attest-privateerr
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-name: ${{ env.PRIVATEERR_IMAGE_REF }}
          subject-digest: ${{ steps.publish-privateerr.outputs.digest }}
          push-to-registry: true

      #
      # Publish the equivalent registry-backed attestation for Buccaneerr.
      #
      - name: "Stamp Buccaneerr's Provenance Scroll 🧾"
        id: attest-buccaneerr
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-name: ${{ env.BUCCANEERR_IMAGE_REF }}
          subject-digest: ${{ steps.publish-buccaneerr.outputs.digest }}
          push-to-registry: true

      #
      # Keep Docker Hub's landing page synchronized with the checked-in
      # public image documentation.
      #
      - name: "Update Privateerr Docker Hub overview 📘"
        id: overview
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository_owner }}/privateerr
          short-description: "Generate PIA WireGuard config and Gluetun port forwarding metadata."
          readme-filepath: ./docs/docker-hub-description.md

      #
      # Export only validated short tags for notifications. Full references remain
      # local to the build and mirror steps; notification metadata cannot gate publication.
      #
      - name: "Prepare the Notification Tag Labels 🏷️"
        id: notification-tags
        if: always()
        continue-on-error: true
        env:
          PRIVATEERR_TAGS: ${{ steps.meta-privateerr.outputs.tags }}
          BUCCANEERR_TAGS: ${{ steps.meta-buccaneerr.outputs.tags }}
        run: |
          privateerr_tags=$(sh .github/scripts/notification-tags.sh \
              --image "${PRIVATEERR_IMAGE_REF}" --tags "${PRIVATEERR_TAGS}")
          buccaneerr_tags=$(sh .github/scripts/notification-tags.sh \
              --image "${BUCCANEERR_IMAGE_REF}" --tags "${BUCCANEERR_TAGS}")

          # The delimiter contains colons, which cannot occur in a validated short tag.
          {
              printf 'privateerr-tags<<:notification-tags:\n%s\n:notification-tags:\n' "${privateerr_tags}"
              printf 'buccaneerr-tags<<:notification-tags:\n%s\n:notification-tags:\n' "${buccaneerr_tags}"
          } >> "${GITHUB_OUTPUT}"

  #
  # Report image evidence even when validation fails or publication is skipped.
  # Delivery failures never change publication results or stop another destination.
  #
  notify-result:
    name: "Read the Image Receipts 📣 (${{ matrix.image-name }}, ${{ matrix.profile }})"
    if: always() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    needs: [notify-start, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: privateerr
            image-name: Privateerr
            profile: image-primary
            dockerhub: true
          - image: privateerr
            image-name: Privateerr
            profile: image-secondary
            dockerhub: true
          - image: buccaneerr
            image-name: Buccaneerr
            profile: image-primary
            dockerhub: false
          - image: buccaneerr
            image-name: Buccaneerr
            profile: image-secondary
            dockerhub: false

    steps:
      #
      # Read notification assets without retaining repository credentials.
      #
      - name: "Unpack the Notification Wardrobe 🧰"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      #
      # Name only the two notification secrets and keep webhook values out of logs.
      # Guard both routes so an unset webhook cannot select the other server.
      #
      - name: "Notify Discord: image pipeline result 📣"
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ matrix.profile == 'image-primary' && secrets.DISCORD_WEBHOOK_URL || matrix.profile == 'image-secondary' && secrets.DISCORD_HADES_HOOK_URL || '' }}
          IMAGE_NAME: ${{ matrix.image-name }}
          PROFILE: ${{ matrix.profile }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          ACTOR: ${{ github.actor }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DOCKERHUB_IMAGE: ${{ matrix.dockerhub && format('docker.io/{0}/{1}', github.repository_owner, matrix.image) || '' }}
          JOB_STATUS: ${{ needs.build-and-push.outputs[format('{0}-result', matrix.image)] || needs.build-and-push.result }}
          PUBLICATION_STATUS: ${{ needs.build-and-push.outputs[format('{0}-publication', matrix.image)] }}
          MIRROR_STATUS: ${{ needs.build-and-push.outputs[format('{0}-mirror', matrix.image)] }}
          FAILURE_STAGE: ${{ needs.build-and-push.outputs[format('{0}-stage', matrix.image)] }}
          PUBLISHED_TAGS: ${{ needs.build-and-push.outputs[format('{0}-tags', matrix.image)] }}
          PUBLISHED_DIGEST: ${{ needs.build-and-push.outputs[format('{0}-digest', matrix.image)] }}
          GHCR_PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/${{ matrix.image }}
          DOCKERHUB_URL: ${{ matrix.dockerhub && format('https://hub.docker.com/r/{0}/{1}', github.repository_owner, matrix.image) || '' }}
        run: |
          sh .github/scripts/discord-notifier.sh \
              --type "image-verdict" \
              --profile "${PROFILE}" \
              --image-name "${IMAGE_NAME}" \
              --run-url "${RUN_URL}" \
              --repository "${REPOSITORY}" \
