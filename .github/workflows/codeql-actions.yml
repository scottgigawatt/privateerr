#
# codeql-actions.yml: Analyze Privateerr's GitHub Actions and Python source.
#

name: "Interrogate the Code Rigging 🔎🏴‍☠️"

#
# Inspect every change entering main, every resulting main commit, and any
# manually requested security review.
#
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  #
  # Run CodeQL with the permissions needed to read workflow metadata and
  # publish Actions and Python findings to code scanning.
  #
  codeql-actions:
    name: ${{ matrix.language == 'actions' && 'Sniff the Workflow Bilge 🔍' || 'Sniff the Python Bilge 🐍' }}
    strategy:
      matrix:
        language: [actions, python]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      #
      # Check out without retaining credentials before CodeQL inspects the
      # repository's workflows and Python source.
      #
      - name: "Grab the Treasure Map 🗺️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      #
      # Initialize a separate CodeQL database for each supported source language.
      #
      - name: "Wake the CodeQL Kraken 🐙"
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          languages: ${{ matrix.language }}

      #
      # Analyze each language and keep its findings in a dedicated category.
      #
      - name: "Read the Cursed Scrolls 📜"
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          category: "/language:${{ matrix.language }}"
